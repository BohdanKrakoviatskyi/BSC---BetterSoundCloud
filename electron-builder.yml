appId: com.bettersoundcloud.app
productName: BetterSoundCloud
directories:
  output: release
files:
  - electron/main.js
  - src/renderer/**/*
  - package.json
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-Windows.${ext}
mac:
  target:
    - dmg
  category: public.app-category.music
  artifactName: ${productName}-${version}-macOS.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
