[package]
name = "resonance"
version = "0.2.0"
description = "Resonance desktop application"
authors = ["Resonance"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-updater = "=2.13.3"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
