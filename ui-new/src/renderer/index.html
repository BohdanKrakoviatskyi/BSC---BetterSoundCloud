<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>BetterSoundCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="window-tools"><button class="icon-button" data-action="back" aria-label="Назад" data-icon="chevron-left"></button><button class="icon-button" data-action="forward" aria-label="Вперёд" data-icon="chevron-right"></button></div>
      <div class="global-search"><button class="home-button" data-route="home" aria-label="Главная" data-icon="house"></button><label class="search-box"><span data-icon="search"></span><input id="globalSearch" placeholder="Что хочешь включить?" autocomplete="off"/><button class="search-shortcut" data-action="queue" title="Очередь" data-icon="list-music"></button></label></div>
      <div class="top-actions"><button class="icon-button" data-action="notifications" aria-label="Уведомления" data-icon="bell"></button><button class="icon-button" data-route="settings" aria-label="Настройки" data-icon="settings"></button><button class="profile" data-action="profile">G</button><span class="divider"></span><button class="icon-button win-action" aria-label="Свернуть">−</button><button class="icon-button win-action" aria-label="Закрыть">×</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar panel">
        <nav class="primary-nav" aria-label="Главная навигация">
          <button class="nav-link active" data-route="home"><span data-icon="house"></span>Главная</button>
          <button class="nav-link" data-route="search"><span data-icon="search"></span>Поиск</button>
          <button class="nav-link" data-route="collection"><span data-icon="library"></span>Моя медиатека</button>
          <button class="nav-link" data-route="history"><span data-icon="clock"></span>Недавние прослушивания</button>
        </nav>
        <div class="library-block">
          <div class="library-heading"><button class="library-title" data-route="collection"><span data-icon="library"></span>Моя медиатека</button><button class="icon-button" data-action="create" aria-label="Создать плейлист" data-icon="plus"></button><button class="icon-button" data-action="expand-library" aria-label="Развернуть" data-icon="arrow-up-right"></button></div>
          <div class="library-filters"><button class="chip active" data-library-filter="all">Всё</button><button class="chip" data-library-filter="playlist">Плейлисты</button><button class="chip" data-library-filter="artist">Артисты</button></div>
          <div class="library-tools"><button class="icon-button" data-action="library-search" aria-label="Поиск в медиатеке" data-icon="search"></button><button class="sort-button" data-action="sort-library">Недавние <span data-icon="list-filter"></span></button></div>
          <div class="library-list" id="libraryList"></div>
        </div>
        <div class="sidebar-bottom"><span class="online-dot"></span> Ваша музыка, в одном месте</div>
      </aside>
      <main class="main-view panel" id="mainView"><div class="main-scroll" id="mainScroll"></div></main>
    </div>
    <footer class="player-bar">
      <div class="now-playing empty"><button class="now-playing-cover" data-action="now-playing" aria-label="Открыть текущий трек"><img id="playerArt" alt="Обложка трека"/></button><div class="track-copy"><button class="track-title-button" data-action="now-playing"><b id="playerTitle">Выбери музыку</b></button><button id="playerArtist" data-action="current-artist">Здесь начнётся твоё звучание</button></div><button class="like-button" id="likeButton" aria-label="Добавить в любимые" data-icon="heart"></button></div>
      <div class="player-center"><div class="transport"><button class="player-icon" data-action="shuffle" aria-label="Перемешать" data-icon="shuffle"></button><button class="player-icon" id="previousButton" aria-label="Предыдущий" data-icon="skip-back"></button><button class="play-button" id="playButton" aria-label="Воспроизвести" data-icon="play"></button><button class="player-icon" id="nextButton" aria-label="Следующий" data-icon="skip-forward"></button><button class="player-icon" data-action="repeat" aria-label="Повтор" data-icon="repeat"></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="100" value="0"/><span id="duration">0:00</span></div></div>
      <div class="player-right"><button class="player-icon" id="queueButton" aria-label="Очередь" data-icon="list-music"></button><button class="player-icon" data-action="device" aria-label="Устройства" data-icon="cast"></button><button class="player-icon" data-action="mute" aria-label="Громкость" data-icon="volume-2"></button><input class="volume" type="range" min="0" max="100" value="72" aria-label="Громкость"/><button class="player-icon" data-action="full-screen" aria-label="На весь экран" data-icon="maximize"></button></div>
    </footer>
    <aside class="queue-panel" id="queuePanel"><div class="queue-heading"><div><span class="eyebrow">СЕЙЧАС ИГРАЕТ</span><h3>Очередь</h3></div><button class="icon-button" data-action="queue" data-icon="x" aria-label="Закрыть очередь"></button></div><p class="queue-subhead">Далее в очереди</p><div id="queueList"></div></aside>
    <div class="modal-layer" id="modalLayer" aria-hidden="true"><section class="modal panel" id="modal"></section></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
