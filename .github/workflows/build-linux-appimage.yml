name: Build Linux AppImage

on:
  push:
    branches:
      - feature/soundcloud-frontend
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libfuse2t64 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux backend sidecar
        run: npm run build:go

      - name: Build AppImage
        run: npx tauri build --bundles appimage

      - name: Generate checksum
        run: sha256sum src-tauri/target/release/bundle/appimage/*.AppImage > src-tauri/target/release/bundle/appimage/SHA256SUMS

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BetterSoundCloud-AppImage-linux-x86_64
          path: src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
          retention-days: 30
