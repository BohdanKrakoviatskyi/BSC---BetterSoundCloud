name: Publish desktop release

# The shape of this workflow is the one the Tauri app's release workflow
# (BSC---BetterSoundCloud/.github/workflows/release.yml) already proved:
# one job with a platform matrix, a dispatch input that narrows the matrix to a
# single platform, a version synced from the tag before anything is built, and
# Apple signing that is used when the secrets are there and reported when they
# are not. What differs is only the middle: there is no tauri-action to bundle
# and publish for a cmake/qt app, so each platform builds and packages with its
# own toolchain and publishes its own assets into the same release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and publish (for example, v0.3.4)
        required: true
        type: string
      platform:
        description: 'Runner to build. "all" builds every platform.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-22.04
          - windows-latest
          - macos-latest

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # one platform at a time: every job appends to the same release, and
      # serialising them keeps the asset list in a predictable order
      max-parallel: 1
      matrix:
        # A platform picked in the dispatch input narrows the matrix to that one
        # runner, so a single platform can be rebuilt after a failure without
        # rebuilding the other two. An empty inputs.platform — a tag push, where
        # there is no input at all — expands to the full list. The filter has to
        # live here because the matrix is not available in a job-level if, and
        # fromJSON is what turns the one-element string into an array.
        platform: ${{ inputs.platform != '' && inputs.platform != 'all' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["ubuntu-22.04", "windows-latest", "macos-latest"]') }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          # The app goes into ./swiftify rather than the workspace root, because
          # cmake finds the soundcloud sidecar at ../BSC---BetterSoundCloud/backend
          # (SWIFTIFY_SIDECAR_SOURCE_DIR): the two checkouts have to sit side by
          # side for that default to resolve.
          path: swiftify

      # The go sidecar is one copy of the local-api that lives in the better
      # soundcloud repository, not a copy vendored here: a release builds it
      # from that source, exactly as a local build does.
      - name: Check out the soundcloud sidecar source
        uses: actions/checkout@v4
        with:
          repository: BohdanKrakoviatskyi/BSC---BetterSoundCloud
          ref: main
          path: BSC---BetterSoundCloud
          sparse-checkout: |
            backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync version from the release tag
        working-directory: swiftify
        shell: bash
        # the tag is the version: every file that carries one is rewritten here,
        # so the bundle, the core and the updater agree on what this build is
        run: node scripts/sync-release-version.mjs "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BSC---BetterSoundCloud/backend/go.mod
          cache-dependency-path: BSC---BetterSoundCloud/backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # ── build dependencies, per platform ───────────────────────────────────
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config file wget \
            git ca-certificates \
            libgl1-mesa-dev libvulkan-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 \
            libwayland-dev libdbus-1-dev libpulse-dev libasound2-dev \
            libsecret-1-dev libssl-dev \
            libfuse2 patchelf
          echo "QT_ROOT_DIR check: ${QT_ROOT_DIR:-not yet set}"

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          # 6.9 is the oldest version CMakeLists.txt asks cmake for (REQUIRES 6.9), and
          # the newest one Qt has actually published for windows: 6.11 and later
          # are listed by aqt but their Updates.xml is not there yet, and 6.12
          # makes qcoro 0.11 fail on a missing QML private module.
          # QtMultimedia and QtShaderTools are not part of the base install,
          # though the app's find_package asks for both.
          version: '6.9.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Build QCoro (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # not in the Qt release and not packaged for ubuntu 22.04.
        # install-qt-action exports QT_ROOT_DIR, not Qt6_DIR
        run: |
          set -euo pipefail
          echo "Using Qt at $QT_ROOT_DIR"

          # QCoro turns QtWebSockets and QtTest support on by default, and its
          # tests are built whenever BUILD_TESTING is set — which install-qt's
          # own configure steps set. The app links QCoro Core and Network only,
          # so all three are switched off: each one either wants a Qt module the
          # app never uses or a test binary the release has no use for.
          # v0.14.0 is qtkeychain's newest tag — 0.15.0 does not exist.
          git clone --depth 1 --branch v0.11.0 \
            https://github.com/danvratil/qcoro.git "$RUNNER_TEMP/qcoro"
          cmake -S "$RUNNER_TEMP/qcoro" -B "$RUNNER_TEMP/qcoro/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQCORO_WITH_QTWEBSOCKETS=OFF -DQCORO_WITH_QTTEST=OFF \
            -DQCORO_BUILD_TESTING=OFF -DQCORO_BUILD_EXAMPLES=OFF \
            -DQCORO_ENABLE_COMPAT_METHOD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/qcoro/build"
          sudo cmake --install "$RUNNER_TEMP/qcoro/build"

          git clone --depth 1 --branch v0.14.0 \
            https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_WITH_QT6=ON -DBUILD_TEST_APPLICATION=OFF \
            -DLIBSECRET_SUPPORT=ON
          cmake --build "$RUNNER_TEMP/qtkeychain/build"
          sudo cmake --install "$RUNNER_TEMP/qtkeychain/build"

      - name: Install libsecret (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # the keyring behind qtkeychain; libsecret-1-dev above provides pkg-config,
        # but the library the AppImage must bundle comes through here too
        run: |
          sudo apt-get install --yes --no-install-recommends libsecret-1-0

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update --quiet
          brew install cmake ninja qt@6 qcoro6 qtkeychain
          # One toolchain instead of two halves. The runner's default selection
          # is the standalone Command Line Tools, and its SDK is newer than the
          # linker that has to read it — the .tbd files list arm64e.x1, which
          # the linker reports as an unknown architecture. Selecting Xcode pairs
          # its ld with its own SDK, and SDKROOT pins cmake to that same one.
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          SDKROOT_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT_PATH" >> "$GITHUB_ENV"
          echo "using $XCODE_APP at $SDKROOT_PATH"

          # Homebrew's Qt carries the sdk it was built against into every link
          # line: an -L and an -rpath at <sdk>/usr/lib, with an explicit
          # -lSystem -lc -lm beside them. That sdk on this image is the standalone
          # Command Line Tools one, so ld reads its .tbd files — and dies on them
          # looking up libraries that -isysroot already names. Repointing that
          # path at the sdk this build uses makes those entries resolve to the
          # same libraries the sysroot does.
          CLT_SDK=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          if [ -e "$CLT_SDK" ]; then
            CLT_SDK_REAL="$(cd "$CLT_SDK" && pwd -P)"
            if [ "$CLT_SDK_REAL" != "$SDKROOT_PATH" ]; then
              sudo mv "$CLT_SDK" "$CLT_SDK.runner"
              sudo ln -s "$SDKROOT_PATH" "$CLT_SDK"
              echo "repointed $CLT_SDK at $SDKROOT_PATH"
            fi
          fi

      # The MSVC build environment, before anything runs cmake. The runner image
      # ships a MinGW toolchain, and cmake's default compiler search found that
      # first: qcoro and qtkeychain were then built with g++ against msvc Qt and
      # linked with mingw's ld, which cannot resolve Qt's __imp__ imports at all.
      # This puts the Visual Studio compiler and its environment first.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          # 6.9 for the same reason as on linux, and it is the newest Qt windows has
          # actually published: 6.10.3 works too and is the alternative if
          # something in 6.9 misbehaves. qtshadertools and qtmultimedia are
          # asked for by the app's find_package and are not in the base install.
          version: '6.9.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # both cmake calls below ask for the Ninja generator, and the runner
        # image does not ship it
        run: choco install ninja --no-progress -y

      - name: Build QCoro and QtKeychain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Neither qcoro nor qtkeychain is a vcpkg port (the ports the previous
        # commit named do not exist), so both are built the way the linux job
        # builds them, from source, against the Qt install-qt-action laid down,
        # and installed into C:\qcoro-install, which the app's cmake is pointed at.
        run: |
          $ErrorActionPreference = 'Stop'
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) { $qt = $env:Qt6_DIR }
          if (-not $qt) { throw 'QT_ROOT_DIR is not set; install-qt-action ran?' }
          "QT_ROOT_DIR is $qt"

          $env:PATH = "$qt/bin;$env:PATH"

          # the url comes first: git clone takes <repository> [directory], and getting
          # that backwards made cmake point at a directory git never created
          # QCoro's own tests and examples are on by default and want QtTest, which the
          # app never uses. A release builds none of it, so the test tree and the
          # QtTest and WebSockets support are switched off.
          git clone --depth 1 --branch v0.11.0 https://github.com/danvratil/qcoro.git qcoro
          cmake -S qcoro -B qcoro\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qt" `
            -DCMAKE_INSTALL_PREFIX="C:\qcoro-install" `
            -DQCORO_WITH_QTWEBSOCKETS=OFF -DQCORO_WITH_QTTEST=OFF `
            -DQCORO_BUILD_TESTING=OFF -DQCORO_BUILD_EXAMPLES=OFF `
            -DQCORO_ENABLE_COMPAT_METHOD_TESTS=OFF
          cmake --build qcoro\build
          cmake --install qcoro\build

          git clone --depth 1 --branch v0.14.0 https://github.com/frankosterfeld/qtkeychain.git qtkeychain
          cmake -S qtkeychain -B qtkeychain\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qt;C:\qcoro-install" `
            -DCMAKE_INSTALL_PREFIX="C:\qcoro-install" `
            -DBUILD_WITH_QT6=ON -DBUILD_TEST_APPLICATION=OFF `
            -DLIBSECRET_SUPPORT=OFF
          cmake --build qtkeychain\build
          cmake --install qtkeychain\build

          "QCORO_PREFIX=C:\qcoro-install" >> $env:GITHUB_ENV

      

      # ── Apple signing, used when the secrets are there ─────────────────────
      - name: Check for Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
            if [ -n "$APPLE_ID" ]; then
              echo "notarize=true" >> "$GITHUB_OUTPUT"
            else
              echo "notarize=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc signing. The identity must not be empty: cmake passes it to
            # codesign, and codesign with no identity at all fails the build.
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer certificate
        if: steps.apple.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # ── build ─────────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: swiftify
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.apple.outputs.identity }}
        run: |
          set -euo pipefail
          QT_PREFIX="$(brew --prefix qt@6)"
          QCORO_PREFIX="$(brew --prefix qcoro6)"
          KEYCHAIN_PREFIX="$(brew --prefix qtkeychain)"
          export PATH="$QT_PREFIX/bin:$PATH"

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$QCORO_PREFIX;$KEYCHAIN_PREFIX" \
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend" \
            -DSWIFTIFY_CODESIGN_IDENTITY="$SIGNING_IDENTITY"

          cmake --build build --target swiftify

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: swiftify
        shell: bash
        run: |
          set -euo pipefail
          # qcoro and qtkeychain were installed into /usr/local, which cmake
          # searches by default
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend"
          cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: swiftify
        shell: pwsh
        run: |
          # qcoro and qtkeychain are installed into C:\qcoro-install and
          # brought in via CMAKE_PREFIX_PATH
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\qcoro-install" `
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend"
          cmake --build build

      - name: Check the soundcloud sidecar was built in
        shell: bash
        working-directory: swiftify
        # a missing sidecar is silent at run time — the app just says the service
        # is missing — so a release fails here instead of shipping without it
        run: |
          set -euo pipefail
          # the go tool writes local-api.exe on windows and local-api elsewhere
          if ! ls build/sidecar/local-api* > /dev/null 2>&1; then
            echo "::error::the soundcloud sidecar was not built; check the go source at ../BSC---BetterSoundCloud/backend"
            exit 1
          fi
          ls -l build/sidecar/local-api*

      # ── package ───────────────────────────────────────────────────────────
      - name: Package DMG and zip (macOS)
        if: runner.os == 'macOS'
        working-directory: swiftify
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.apple.outputs.identity }}
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          ./packaging/macos/package-dmg.sh \
            build/swiftify.app release-artifacts "$VERSION" "$SIGNING_IDENTITY"

      - name: Notarize DMG
        if: runner.os == 'macOS' && steps.apple.outputs.notarize == 'true'
        working-directory: swiftify
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          DMG="release-artifacts/Resonance-${VERSION}-macOS.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: swiftify
        shell: bash
        run: |
          set -euo pipefail
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          ./packaging/linux/package-appimage.sh build release-artifacts "$VERSION"

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        working-directory: swiftify
        shell: pwsh
        # one archive, and only that: the updater downloads the first asset it
        # finds with a matching extension, and a bare swiftify.exe next to a zip
        # would be pickable and unusable
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $staging = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          Copy-Item 'build/swiftify.exe' $staging
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release `
            --no-translations --no-system-d3d-compiler `
            (Join-Path $staging 'swiftify.exe')

          # the go sidecar sits beside the binary the app looks next to itself.
          # the go tool names it local-api.exe on windows, and the app asks for
          # that name there (SidecarClient)
          $sidecar = Get-ChildItem (Join-Path $PWD 'build/sidecar') -Filter 'local-api*' |
            Select-Object -First 1
          if (-not $sidecar) { throw 'the go sidecar is missing from build/sidecar' }
          Copy-Item $sidecar.FullName $staging
          Get-ChildItem $staging

          Compress-Archive -Path (Join-Path $staging '*') `
            -DestinationPath "release-artifacts/Resonance-${version}-Windows.zip"
          Get-ChildItem release-artifacts

      # ── publish ───────────────────────────────────────────────────────────
      - name: Publish this platform's assets to the release
        uses: softprops/action-gh-release@v2
        with:
          # every platform writes to the same tag, so the release is the union of
          # what the three runners produced. Re-running a single platform appends
          # to it rather than starting over.
          tag_name: ${{ env.RELEASE_TAG }}
          # a tag created here points at the commit that was built, not at the
          # default branch: a dispatch with a brand new tag used to leave the tag
          # pointing somewhere the sources never were
          target_commitish: ${{ github.sha }}
          name: Resonance ${{ env.RELEASE_TAG }}
          body: |
            ## Resonance ${{ env.RELEASE_TAG }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | 🍎 macOS | `Resonance-*-macOS.dmg` |
            | 🪟 Windows | `Resonance-*-Windows.zip` |
            | 🐧 Linux | `Resonance-*-Linux.AppImage` |

            > [!NOTE]
            > **macOS**: the app is signed ad hoc unless the Apple secrets are set; if Gatekeeper
            > blocks it, right-click → Open, or run `xattr -cr Resonance.app`.
            > **Linux**: `chmod +x Resonance-*.AppImage` before running it.
            > **Windows**: extract the zip and run `swiftify.exe`.
          draft: false
          prerelease: false
          # the updater reads the latest release, so a draft would be invisible
          # to it; asset names carry the platform, which is what it matches on
          files: swiftify/release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report signing mode
        # Windows defaults to PowerShell, where this bash is spelled out
        shell: bash
        env:
          APPLE_SIGNED: ${{ steps.apple.outputs.enabled == 'true' }}
          APPLE_NOTARIZED: ${{ steps.apple.outputs.notarize == 'true' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$APPLE_SIGNED" = "true" ] && [ "$APPLE_NOTARIZED" = "true" ]; then
              echo "macOS build: Apple Developer signed and notarised"
            elif [ "$APPLE_SIGNED" = "true" ]; then
              echo "::warning::macOS build is signed but NOT notarised; Gatekeeper still blocks it on first launch. Set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID."
            else
              echo "::warning::macOS build is ad-hoc signed and NOT notarised. Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_KEYCHAIN_PASSWORD to sign it."
            fi
          else
            echo "$RUNNER_OS build: platform code signing is not configured; the installer is unsigned."
          fi
