name: Build and publish desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example, v0.2.7)
        required: true
        type: string
      publish:
        description: Upload the finished packages to that GitHub release.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  linux:
    name: "Linux: build and package"
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: resonance
      - name: Check out sidecar source
        uses: actions/checkout@v4
        with:
          repository: BohdanKrakoviatskyi/BSC---BetterSoundCloud
          ref: feature/soundcloud-backend
          path: BSC---BetterSoundCloud
          sparse-checkout: |
            backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BSC---BetterSoundCloud/backend/go.mod
      - name: Set up build tools
        uses: ./.github/actions/setup-linux
      - name: Build and package
        working-directory: resonance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-release-version.mjs "$RELEASE_TAG"
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend"
          cmake --build build
          test -f build/sidecar/local-api
          mkdir -p release-artifacts
          ./packaging/linux/package-appimage.sh build release-artifacts "${RELEASE_TAG#v}"
          APPIMAGE="$(find release-artifacts -maxdepth 1 -name 'Resonance-*-Linux*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract > /dev/null
          for entry in usr/bin/resonance usr/bin/local-api usr/share/applications/resonance.desktop; do
            test -e "squashfs-root/$entry"
          done
          for library in 'libQt6Core.so*' 'libQt6Quick.so*' 'libQt6Multimedia.so*' libqxcb.so 'libqt6keychain.so*'; do
            find squashfs-root -name "$library" -print -quit | grep -q .
          done
          rm -rf squashfs-root
      - name: Upload to GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Resonance ${{ env.RELEASE_TAG }}
          files: resonance/release-artifacts/*

  windows:
    name: "Windows: build and package"
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: resonance
      - name: Check out sidecar source
        uses: actions/checkout@v4
        with:
          repository: BohdanKrakoviatskyi/BSC---BetterSoundCloud
          ref: feature/soundcloud-backend
          path: BSC---BetterSoundCloud
          sparse-checkout: |
            backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BSC---BetterSoundCloud/backend/go.mod
      - name: Set up build tools
        uses: ./.github/actions/setup-windows
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: resonance/spotify-core -> resonance/build/cargo/spotify-core_d7008
      - name: Build and package
        working-directory: resonance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/sync-release-version.mjs $env:RELEASE_TAG
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;C:\qcoro-install" `
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend"
          cmake --build build
          $sidecar = 'build/sidecar/local-api.exe'
          if (-not (Test-Path $sidecar)) { throw "sidecar missing: $sidecar" }

          $version = $env:RELEASE_TAG -replace '^v', ''
          $staging = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force $staging, release-artifacts | Out-Null
          Copy-Item 'build/resonance.exe', $sidecar $staging
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir (Join-Path $PWD 'qml') --no-translations --no-system-d3d-compiler --ignore-library-errors (Join-Path $staging 'resonance.exe')
          $required = @(
            'resonance.exe','local-api.exe','Qt6Core.dll','Qt6Gui.dll','Qt6Quick.dll','Qt6Qml.dll',
            'Qt6Multimedia.dll','Qt6DBus.dll','Qt6Network.dll','Qt6Widgets.dll',
            'platforms/qwindows.dll','iconengines/qsvgicon.dll','imageformats/qjpeg.dll','imageformats/qsvg.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $staging $_)) })
          if ($missing) { throw "Windows package misses: $($missing -join ', ')" }
          $systemDir = Join-Path $env:SystemRoot 'System32'
          $imports = & dumpbin /dependents (Join-Path $staging 'resonance.exe') |
            Select-String -Pattern '^\s+\S+\.dll\s*$' |
            ForEach-Object { $_.Line.Trim().ToLower() } | Sort-Object -Unique
          $windowsDlls = @($imports | Where-Object {
            $_ -like 'api-ms-win-*' -or $_ -like 'ext-ms-win-*' -or
            $_ -in @('ucrtbase.dll','vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')
          })
          $missingDlls = @($imports | Where-Object {
            $_ -notin $windowsDlls -and -not (Test-Path (Join-Path $staging $_)) -and
            -not (Test-Path (Join-Path $systemDir $_))
          })
          if ($missingDlls) { throw "Windows package misses DLLs: $($missingDlls -join ', ')" }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath "release-artifacts/Resonance-${version}-Windows.zip"
      - name: Upload to GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Resonance ${{ env.RELEASE_TAG }}
          files: resonance/release-artifacts/*

  macos:
    name: "macOS: build and package"
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: resonance
      - name: Check out sidecar source
        uses: actions/checkout@v4
        with:
          repository: BohdanKrakoviatskyi/BSC---BetterSoundCloud
          ref: feature/soundcloud-backend
          path: BSC---BetterSoundCloud
          sparse-checkout: |
            backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BSC---BetterSoundCloud/backend/go.mod
      - name: Set up build tools
        uses: ./.github/actions/setup-macos
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: resonance/spotify-core -> resonance/build/cargo/spotify-core_7143b
      - name: Build and package
        working-directory: resonance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-release-version.mjs "$RELEASE_TAG"
          QT_PREFIX="$(brew --prefix qt@6)"
          export PATH="$QT_PREFIX/bin:$PATH"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX;$(brew --prefix qcoro6);$(brew --prefix qtkeychain)" \
            -DSWIFTIFY_SIDECAR_SOURCE_DIR="$PWD/../BSC---BetterSoundCloud/backend" \
            -DSWIFTIFY_CODESIGN_IDENTITY=-
          cmake --build build --target resonance
          test -f build/sidecar/local-api
          mkdir -p release-artifacts
          ./packaging/macos/package-dmg.sh build/resonance.app release-artifacts "${RELEASE_TAG#v}" -
          ZIP="release-artifacts/Resonance-${RELEASE_TAG#v}-macOS.zip"
          test -f "$ZIP"
          CHECK="$(mktemp -d)"
          ditto -x -k "$ZIP" "$CHECK"
          BUNDLE="$CHECK/Resonance.app/Contents"
          for entry in MacOS/resonance MacOS/local-api Frameworks/QtCore.framework/Versions/A/QtCore Frameworks/QtQuick.framework/Versions/A/QtQuick Frameworks/QtMultimedia.framework/Versions/A/QtMultimedia PlugIns/platforms/libqcocoa.dylib; do
            test -e "$BUNDLE/$entry"
          done
          if otool -L "$BUNDLE/MacOS/resonance" | grep -qE '(/opt/homebrew|/usr/local)'; then
            echo 'App bundle still links against libraries from the build machine'
            exit 1
          fi
      - name: Upload to GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Resonance ${{ env.RELEASE_TAG }}
          files: resonance/release-artifacts/*
